name: tammni_app
description: "حضانتي - نظام لإدارة الحضانة ومتابعة الأطفال والتواصل مع أولياء الأمور."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  video_player: ^2.9.2
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

  # Audio messages
  record: 5.2.1
  audioplayers: ^6.1.0

  firebase_core: ^4.6.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^19.0.0
  cloud_functions: ^6.1.0

  supabase_flutter: ^2.5.6

  # Live streaming / WebRTC
  flutter_webrtc: ^0.14.2

  # PDF / Printing
  pdf: ^3.11.1
  printing: ^5.13.4

dependency_overrides:
  record_linux: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/hadanati_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icons/hadanati_icon.png"
    background_color: "#F8FBFF"
    theme_color: "#7C83FD"

  windows:
    generate: true
    image_path: "assets/icons/hadanati_icon.png"
    icon_size: 256